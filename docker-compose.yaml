services:
  backend:
    build:
      context: ./todo-jenkins/backend
    ports:
      - "5000:5000"
    depends_on:
      jenkins:
        condition: service_healthy

  frontend:
    build:
      context: ./todo-jenkins/frontend
    ports:
      - "3000:80"
    depends_on:
      jenkins:
        condition: service_healthy

  jenkins:
    container_name: my-jenkins
    user: root
    build:
      context: ./todo-jenkins/jenkins
    image: my-jenkins:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -f http://localhost:8080/login > /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  jenkins_home:
